
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy of S2 Legal AI - Pro Edition</title>
    <meta name="description" content="A safety-first, multi-agent AI demonstrator with Smart Hearing Scheduling for Advocates and Clients.">
    <meta property="og:title" content="Copy of S2 Legal AI - Pro Edition">
    <meta property="og:description" content="A safety-first, multi-agent AI demonstrator with Smart Hearing Scheduling for Advocates and Clients.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-primary: #6366f1;
            --neon-secondary: #ec4899;
            --glass-bg: rgba(15, 23, 42, 0.6);
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #020617;
            color: #f8fafc;
            overflow: hidden;
        }
        
        /* Animated Mesh Gradient Background */
        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-color: #020617;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.2) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(79, 70, 229, 0.1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(20, 184, 166, 0.15) 0px, transparent 50%);
            filter: blur(80px);
            animation: backgroundMove 20s infinite alternate;
        }

        @keyframes backgroundMove {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        /* Glassmorphism Ultra */
        .glass-ultra {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        /* Neon Glowing Border for Input */
        .neon-border {
            position: relative;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .neon-border:focus-within {
            border-color: var(--neon-primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
            transform: translateY(-2px);
        }

        /* Legal Draft Blocks (Code Blocks) */
        pre {
            background: rgba(0, 0, 0, 0.4) !important;
            color: #67e8f9 !important;
            padding: 1.5rem;
            border-radius: 1.25rem;
            font-family: 'monospace';
            font-size: 0.85rem;
            overflow-x: auto;
            margin: 1.5rem 0;
            border: 1px solid rgba(103, 232, 249, 0.2);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }

        /* Table Styling for Comparisons */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 1.5rem 0;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        th {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            text-align: left;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.75rem;
            color: #818cf8;
        }
        td {
            padding: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { 
            background: rgba(99, 102, 241, 0.3); 
            border-radius: 10px; 
        }

        .legal-content h3 {
            font-weight: 900;
            color: #818cf8;
            margin-top: 2rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .legal-content h3::before {
            content: '';
            width: 3px; height: 14px;
            background: currentColor;
            border-radius: 2px;
            box-shadow: 0 0 10px currentColor;
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="antialiased">
    <div class="mesh-bg"></div>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
